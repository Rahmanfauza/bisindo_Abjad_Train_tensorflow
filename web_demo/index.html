<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bisindo Real-time Detection</title>

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">

    <!-- Dependencies -->
    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.4.0/dist/tf.min.js"></script>
    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>

<body>
    <h1>Bisindo Detection (TFJS + MediaPipe)</h1>

    <div class="container">
        <video id="input_video"></video>
        <canvas id="output_canvas" width="640" height="480"></canvas>
    </div>

    <div id="status" class="status-loading">Initializing...</div>

    <div id="prediction-container">
        <span id="prediction-text" class="prediction-text">Waiting...</span>
        <div id="confidence-text" class="confidence-text">Confidence: 0%</div>
    </div>

    <!-- Main Logic -->
    <script src="script.js"></script>
</body>

</html>
